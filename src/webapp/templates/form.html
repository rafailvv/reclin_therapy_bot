<!-- templates/form.html -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Регистрация</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Регистрация в чате</h2>
      <form id="regForm">
        <input type="text" name="fio" placeholder="ФИО" required>
        <select name="specialization" id="specialization" required>
          <option value="">Выберите специализацию</option>
          <!-- Список детских специальностей -->
          <option>Аллергология и иммунология детская</option>
          <option>Анестезиология-реаниматология детская</option>
          <option>Детская гастроэнтерология</option>
          <option>Детская гематология-онкология</option>
          <option>Детская дерматовенерология</option>
          <option>Детская инфекционная медицина</option>
          <option>Детская кардиология</option>
          <option>Детская нефрология</option>
          <option>Детская неврология</option>
          <option>Детская онкология</option>
          <option>Детская оториноларингология</option>
          <option>Детская офтальмология</option>
          <option>Детская психиатрия</option>
          <option>Детская пульмонология</option>
          <option>Детская ревматология</option>
          <option>Детская стоматология</option>
          <option>Детская хирургия</option>
          <option>Медицинская генетика</option>
          <option>Неонатология</option>
          <option>Общая врачебная практика (педиатрия)</option>
          <option>Педиатрия</option>
          <option>Подростковая медицина</option>
          <option>Травматология-ортопедия детская</option>
          <option>Ультразвуковая диагностика детская</option>
          <option>Физиотерапия детская</option>
          <option>Эндокринология детская</option>
          <option>Другое</option>
        </select>
<!--        <input type="email" name="email" placeholder="E-mail" required>-->

        <div class="checkbox-group">
          <label class="checkbox">
            <input type="checkbox" id="privacy">
            <span>Я согласен с <a href="{{ url_for('static', path='privacy_policy.pdf') }}" target="_blank">политикой конфиденциальности</a></span>
          </label>
          <label class="checkbox">
            <input type="checkbox" id="rules">
            <span>Я прочитал <a href="{{ url_for('static', path='chat_rules.pdf') }}" target="_blank">правила чата</a></span>
          </label>
        </div>

        <button type="submit" id="nextBtn" disabled>Далее</button>
      </form>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const form = document.getElementById('regForm');
    const next = document.getElementById('nextBtn');
    const boxes = Array.from(document.querySelectorAll('input[type=checkbox]'));

    function validate() {
      const filled = [...form.elements].filter(e => e.required).every(e => e.value.trim());
      const checked = boxes.every(b => b.checked);
      next.disabled = !(filled && checked);
    }

    form.addEventListener('input', validate);
    boxes.forEach(b => b.addEventListener('change', validate));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      next.disabled = true;

      try {
      const payload = {
        telegram_id: tg.initDataUnsafe.user.id,
        username: tg.initDataUnsafe.user.username,
        fio: form.fio.value.trim(),
        specialization: form.specialization.value.trim(),
        // email: form.email.value.trim()
      };

      const r = await fetch('/pediatrics/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData},
        body: JSON.stringify(payload)
      });
      const res = await r.json();
      if (!r.ok || !res.link) {
        throw new Error(r.status === 401
          ? 'Откройте форму заново через кнопку в Telegram.'
          : 'Не удалось сохранить данные. Попробуйте ещё раз.');
      }
      tg.openTelegramLink(res.link);
      tg.close();
      } catch (error) {
        window.alert(error.message);
        validate();
      }
    });
  </script>
</body>
</html>
