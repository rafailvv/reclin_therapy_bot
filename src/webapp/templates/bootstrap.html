<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <p id="status" role="status">Загрузка…</p>
  <script>
    (async () => {
      try {
        const app = window.Telegram.WebApp;
        app.ready();
        if (!app.initData) throw new Error('Откройте форму через кнопку в Telegram.');
        const response = await fetch(window.location.pathname + window.location.search, {
          headers: {'X-Telegram-Init-Data': app.initData},
          cache: 'no-store'
        });
        if (!response.ok) throw new Error('Не удалось войти. Откройте форму заново через кнопку в Telegram.');
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('status').textContent = error.message;
      }
    })();
  </script>
</body>
</html>
